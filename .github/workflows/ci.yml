name: CI

# Builds every output (SVG, sprite, React, icon font), tests them, and deploys the preview site
# to GitHub Pages on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: npm run build
      - name: Codepoints are committed (new icons need `npm run build` locally first)
        run: git diff --exit-code icons/codepoints.json
      - run: npm run build:font
      - run: npm test
      - name: Package contents
        run: npm pack --dry-run
      - run: npm run site
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    # Preview site: https://thiraphat-ps-dev.github.io/thira-icons/
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
