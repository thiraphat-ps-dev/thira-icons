name: Release

# Publish to npm when a version tag (e.g. v0.2.0) is pushed, or manually from main
# (Actions → Release → Run workflow) to retry a release whose tag already exists.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret, provenance is attached automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No registry-url: it makes setup-node inject a placeholder NODE_AUTH_TOKEN,
          # which npm then sends instead of exchanging an OIDC trusted-publishing token.
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: npm ci
      - run: pip install -r requirements.txt
      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Manual runs only release from main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF_NAME" = "main"
      - run: npm run build
      - run: npm run build:font
      - run: npm test
      - name: Publish (skip if this version is already on npm)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view "thira-icons@$V" version >/dev/null 2>&1; then
            echo "thira-icons@$V is already published, skipping."
          else
            npm publish
          fi
