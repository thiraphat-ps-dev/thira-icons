const groups = {};
for (const [k, b] of Object.entries(D)) (groups[k.split(' · ')[0]] ??= []).push([k, b]);
document.getElementById('out').outerHTML = Object.values(groups).map((g) => `<div class="row">${g.map(([k, b]) => `<figure>${svg(b, 'big')}<br>${svg(b, 's24')}${svg(b, 's16')}<figcaption>${k}</figcaption></figure>`).join('')}</div>`).join('');
</script>
