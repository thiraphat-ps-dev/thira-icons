<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>thira-icons · style exploration</title>
<style>
  @font-face { font-family: 'Thira Sans'; src: url('https://thiraphat-ps-dev.github.io/thira-sans/fonts/ThiraSans-VF.woff2') format('woff2'); font-weight: 100 700; }
  :root { --bg: #fcfcfe; --surface: #fff; --text: #1d2130; --muted: #5d6275; --border: #e3e5ee; --accent: #4338ca; }
  .dark { --bg: #14161d; --surface: #1b1e27; --text: #eef0f6; --muted: #a7acbd; --border: #2c303d; --accent: #a5b4fc; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 'Thira Sans', system-ui, sans-serif; background: #e9eaf0; color: #1d2130; }
  h1 { font-size: 20px; margin: 20px 16px 4px; }
  p.lead { margin: 0 16px 16px; color: #5d6275; }
  .themes { display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 16px; padding: 0 16px 24px; }
  .theme { background: var(--bg); color: var(--text); border-radius: 16px; padding: 16px; border: 1px solid var(--border); }
  .style { padding: 14px 0; border-top: 1px solid var(--border); }
  .style:first-of-type { border-top: 0; }
  h2 { margin: 0 0 2px; font-size: 16px; }
  .style p { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; }
  .row .label { width: 36px; color: var(--muted); font-size: 12px; }
  .grid48 svg { width: 48px; height: 48px; }
  .grid24 svg { width: 24px; height: 24px; }
  .grid16 svg { width: 16px; height: 16px; }
  .ui { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: 14px; }
  .btn.primary { background: var(--accent); color: var(--bg); border-color: transparent; }
  .btn svg { width: 16px; height: 16px; }
  .big { display: flex; gap: 12px; padding: 0 16px 32px; flex-wrap: wrap; }
  .big figure { margin: 0; background: #fff; border-radius: 12px; padding: 8px; text-align: center; font-size: 12px; color: #5d6275; }
  .big svg { width: 120px; height: 120px; color: #1d2130; background:
      linear-gradient(#e6e8f5 1px, transparent 1px) 0 0 / 5px 5px,
      linear-gradient(90deg, #e6e8f5 1px, transparent 1px) 0 0 / 5px 5px; }
</style>
</head>
<body>
<h1>thira-icons · 3 แนวทาง</h1>
<p class="lead">ไอคอนชุดเดียวกัน 6 ตัว: ค้นหา · ตั้งค่า · ผู้ใช้ · ถังขยะ · ปฏิทิน · บาท — ดูที่ 16 / 24 / 48 px, ในปุ่ม, และแบบขยายบน grid 24 ด้านล่าง</p>
<div class="themes" id="themes"></div>
<div id="big"></div>

<script>
// Gear outline: `teeth` rounded-off teeth between rInner and rOuter, starting at the top.
function gear(cx, cy, rOuter, rInner, teeth, topFrac = 0.42, baseFrac = 0.6) {
  const pts = [];
  const step = (Math.PI * 2) / teeth;
  for (let i = 0; i < teeth; i++) {
    const a = -Math.PI / 2 + i * step;
    const base = (step * baseFrac) / 2, top = (step * topFrac) / 2;
    const p = (r, ang) => [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
    pts.push(p(rInner, a - base), p(rOuter, a - top), p(rOuter, a + top), p(rInner, a + base));
  }
  const f = (n) => Math.round(n * 100) / 100;
  return 'M' + pts.map(([x, y]) => `${f(x)} ${f(y)}`).join('L') + 'Z';
}

const STYLES = {
  A: {
    title: 'A · Soft',
    note: 'เส้น 1.75 · หัวเส้น/รอยต่อกลม · มุมมนมาก (r 4) · รูปทรงอวบ เป็นมิตร',
    attrs: 'fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"',
    icons: {
      search: `<circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/>`,
      settings: `<path d="${gear(12, 12, 9.25, 7, 8, 0.4, 0.62)}"/><circle cx="12" cy="12" r="3"/>`,
      user: `<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>`,
      trash: `<path d="M4 6.5h16"/><path d="M9 6.5V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/><path d="m6 6.5.8 12.2A2.5 2.5 0 0 0 9.3 21h5.4a2.5 2.5 0 0 0 2.5-2.3L18 6.5"/><path d="M10 11v5.5"/><path d="M14 11v5.5"/>`,
      calendar: `<rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3.5 10.5h17"/><path d="M8 15h.01"/><path d="M12 15h.01"/><path d="M16 15h.01"/>`,
      baht: `<path d="M7 5h6a3.5 3.5 0 0 1 0 7H7z"/><path d="M7 12h7a3.5 3.5 0 0 1 0 7H7z"/><path d="M11 3v18"/>`,
    },
  },
  B: {
    title: 'B · Crisp',
    note: 'เส้น 1.5 · หัวเส้นตัดตรง · รอยต่อเหลี่ยม · มุมเล็ก (r 1.5) · แม่นยำ แบบเครื่องมือ',
    attrs: 'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter"',
    icons: {
      search: `<circle cx="10.5" cy="10.5" r="6.75"/><path d="M15.3 15.3 21 21"/>`,
      settings: `<path d="${gear(12, 12, 9.5, 7.25, 8, 0.34, 0.5)}"/><circle cx="12" cy="12" r="3"/>`,
      user: `<circle cx="12" cy="7.5" r="3.75"/><path d="M4 21v-2a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v2"/>`,
      trash: `<path d="M3 6h18"/><path d="M9 6V3h6v3"/><path d="M5.25 6v13.5c0 .8.7 1.5 1.5 1.5h10.5c.8 0 1.5-.7 1.5-1.5V6"/><path d="M10 10v7"/><path d="M14 10v7"/>`,
      calendar: `<rect x="3" y="4.5" width="18" height="16.5" rx="1.5"/><path d="M3 9.5h18"/><path d="M8 2.5v4"/><path d="M16 2.5v4"/><path d="M7 13.5h2.5M10.75 13.5h2.5M14.5 13.5H17M7 17h2.5M10.75 17h2.5"/>`,
      baht: `<path d="M7 4.5h6.25A3.25 3.25 0 0 1 16.5 7.75v.5a3.25 3.25 0 0 1-3.25 3.25H7z"/><path d="M7 11.5h7a3.5 3.5 0 0 1 0 7H7z"/><path d="M11 2.5v18"/>`,
    },
  },
  C: {
    title: 'C · Duotone',
    note: 'แบบ A + พื้นจาง 20% ของสีตัวอักษรในส่วนหลัก · มีน้ำหนัก อบอุ่น (icon font จะเหลือแค่เส้น)',
    attrs: 'fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"',
    icons: {
      search: `<circle cx="10.5" cy="10.5" r="6.5" fill="currentColor" fill-opacity=".2" stroke="none"/><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4.5 4.5"/>`,
      settings: `<path d="${gear(12, 12, 9.25, 7, 8, 0.4, 0.62)}" fill="currentColor" fill-opacity=".2"/><circle cx="12" cy="12" r="3" fill="var(--bg, #fff)"/>`,
      user: `<circle cx="12" cy="8" r="4" fill="currentColor" fill-opacity=".2"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0" fill="currentColor" fill-opacity=".2"/>`,
      trash: `<path d="m6 6.5.8 12.2A2.5 2.5 0 0 0 9.3 21h5.4a2.5 2.5 0 0 0 2.5-2.3L18 6.5" fill="currentColor" fill-opacity=".2"/><path d="M4 6.5h16"/><path d="M9 6.5V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5"/><path d="M10 11v5.5"/><path d="M14 11v5.5"/>`,
      calendar: `<path d="M3.5 10.5V9a4 4 0 0 1 4-4h9a4 4 0 0 1 4 4v1.5z" fill="currentColor" fill-opacity=".2" stroke="none"/><rect x="3.5" y="5" width="17" height="15.5" rx="4"/><path d="M8 3v4"/><path d="M16 3v4"/><path d="M3.5 10.5h17"/><path d="M8 15h.01"/><path d="M12 15h.01"/><path d="M16 15h.01"/>`,
      baht: `<circle cx="12" cy="12" r="10" fill="currentColor" fill-opacity=".2" stroke="none"/><path d="M9.5 7.5h3.75a2.25 2.25 0 0 1 0 4.5H9.5z"/><path d="M9.5 12h4.25a2.25 2.25 0 0 1 0 4.5H9.5z"/><path d="M12 6v12"/>`,
    },
  },
};

const svg = (s, name) => `<svg viewBox="0 0 24 24" ${STYLES[s].attrs} aria-hidden="true">${STYLES[s].icons[name]}</svg>`;
const NAMES = ['search', 'settings', 'user', 'trash', 'calendar', 'baht'];

const block = (s) => `
  <section class="style">
    <h2>${STYLES[s].title}</h2><p>${STYLES[s].note}</p>
    ${[48, 24, 16].map((px) => `<div class="row grid${px}"><span class="label">${px}px</span>${NAMES.map((n) => svg(s, n)).join('')}</div>`).join('')}
    <div class="ui">
      <button class="btn primary">${svg(s, 'search')} ค้นหา</button>
      <button class="btn">${svg(s, 'settings')} ตั้งค่า</button>
      <button class="btn">${svg(s, 'user')} โปรไฟล์</button>
      <button class="btn">${svg(s, 'calendar')} นัดหมาย</button>
      <button class="btn">${svg(s, 'trash')} ลบ</button>
      <button class="btn">${svg(s, 'baht')} ฿1,250</button>
    </div>
  </section>`;

document.getElementById('themes').innerHTML = ['light', 'dark']
  .map((t) => `<div class="theme ${t}">${Object.keys(STYLES).map(block).join('')}</div>`)
  .join('');

document.getElementById('big').innerHTML = Object.keys(STYLES)
  .map((s) => `<h1 style="font-size:15px">${STYLES[s].title} · ขยายบน grid 24</h1><div class="big">${NAMES.map((n) => `<figure>${svg(s, n)}<figcaption>${n}</figcaption></figure>`).join('')}</div>`)
  .join('');
</script>
</body>
</html>
